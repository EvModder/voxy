plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def includeOtherArchs = providers.gradleProperty('includeOtherArchs').getOrElse('false').toBoolean()
def minecraftVersion = providers.gradleProperty('minecraft_version').get()
def loaderVersion = providers.gradleProperty('loader_version').get()
def fabricApiVersion = providers.gradleProperty('fabric_api_version').get()
def sodiumDependency = providers.gradleProperty('sodium_version_modrinth').get()
def sodiumExtraAllows = providers.gradleProperty('sodium_extra_allows').getOrElse('')
def lwjglVersion = '3.4.1'

version = providers.gradleProperty('mod_version').get()
group = providers.gradleProperty('maven_group').get()

base {
    archivesName = providers.gradleProperty('archives_base_name').get()
}

repositories {
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "caffeinemcRepository"
                url = "https://maven.caffeinemc.net/releases"
            }
        }
        filter {
            includeGroup "net.caffeinemc"
        }
    }



    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }

    exclusiveContent {
        forRepository {
            ivy {
                name = "github"
                url = "https://github.com/"
                patternLayout {
                    artifact '/[organisation]/[module]/releases/download/[revision]/[module]-[revision]-[classifier].[ext]'
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeModuleByRegex("[^\\.]+", "nvidium")
        }
    }
}


def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', 'HEAD']
            ignoreExitValue = true
        }

        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>";
        } else {
            return result.standardOutput.asText.get().strip();
        }
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>";
    }
}

def gitWorkingTreeDirty = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'status', '--porcelain', '--untracked-files=normal']
            ignoreExitValue = true
        }

        return result.getResult().get().getExitValue() == 0
                && !result.standardOutput.asText.get().isBlank()
    } catch (Exception e) {
        e.printStackTrace()
        return true
    }
}

def buildtime = {System.currentTimeSeconds()}

def sodiumVersionMatcher = sodiumDependency =~ /[^-]*-([^-]*-?[^-]*)-.*/
if (!sodiumVersionMatcher.matches()) {
    throw new GradleException("Cannot derive Sodium version from '${sodiumDependency}'")
}
def sodiumVersion = sodiumVersionMatcher[0][1]

processResources {
    String sodium_versions;
    {
        StringBuilder sodium_versions_builder = new StringBuilder("[");
        var vers = sodiumExtraAllows.split(" ")
        for (String ver : vers) {
            if (!ver.isBlank()) {
                sodium_versions_builder.append("\"=").append(ver).append("\", ");
            }
        }

        var compatibleSodiumVersion = sodiumVersion.split("-")[0]
        sodium_versions_builder.append("\">=").append(compatibleSodiumVersion).append("- <=").append(compatibleSodiumVersion).append("\"")
        sodium_versions_builder.append("]");
        sodium_versions = sodium_versions_builder.toString();
    }
    String allowed_mc_version;
    {
        allowed_mc_version = minecraftVersion.split("-")[0]
        allowed_mc_version = "[\">=" + allowed_mc_version + "- <=" + allowed_mc_version + "\", \"~" + allowed_mc_version + "\"]";
    }

    var time = buildtime()
    var hash = gitCommitHash()
    var dirty = gitWorkingTreeDirty()
    var version = project.version

    def props = ["version": version, "commit": hash, "dirty": dirty, "buildtime": time, "allowed_sodium_versions": sodium_versions, "allowed_mc_version": allowed_mc_version]

    for (var prop : props) {
        String value = prop.value;
        if (!(value==~/^ *((['"\[{].*)|([0-9]*$)|(true|false$))/)) {
            value = "\"$value\"";
        }
        props[prop.key] = value
    }

    inputs.properties(props);
    filesMatching("fabric.mod.json") {
        filter {line->line.replace("\"\${","\${").replace("}\"", "}")};
        expand(props);
    }
}


var dummySodiumProviderGenerator = tasks.register("dummySodiumProviderGenerator", Jar) {
    destinationDirectory.set(processIncludeJars.outputDirectory);
    archiveFileName.set("dummyprovider.jar");
    dependsOn(processIncludeJars)

    var props = ["sodium_version": sodiumVersion]

    inputs.properties(props);
    from("dummyprovider.fabric.mod.json") {
        rename("dummyprovider.", "");
        expand(props)
    }
}
jar {
    dependsOn(dummySodiumProviderGenerator)

    from("LICENSE.md") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/voxy.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${loaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    implementation "maven.modrinth:sodium:${sodiumDependency}"

    implementation "maven.modrinth:modmenu:${providers.gradleProperty('modmenu_version').get()}"
    implementation "maven.modrinth:lithium:${providers.gradleProperty('lithium_version').get()}"
    compileOnly "maven.modrinth:iris:${providers.gradleProperty('iris_version').get()}"
    compileOnly "maven.modrinth:chunky:${providers.gradleProperty('chunky_version').get()}"
    compileOnly "maven.modrinth:vivecraft:${providers.gradleProperty('vivecraft_version').get()}"
    compileOnly "maven.modrinth:flashback:${providers.gradleProperty('flashback_version').get()}"
    compileOnly "maven.modrinth:nvidium:${providers.gradleProperty('nvidium_version').get()}"

    // Vulkan and platform natives
    include(implementation("org.lwjgl:lwjgl-vulkan:${lwjglVersion}"))
    include(implementation("org.lwjgl:lwjgl-shaderc:${lwjglVersion}"))
    for (nativeClassifier in ["natives-windows", "natives-linux", "natives-macos", "natives-macos-arm64"]) {
        include(runtimeOnly("org.lwjgl:lwjgl-shaderc:${lwjglVersion}:${nativeClassifier}"))
    }
    include(runtimeOnly("org.lwjgl:lwjgl-vulkan:${lwjglVersion}:natives-macos"))
    include(runtimeOnly("org.lwjgl:lwjgl-vulkan:${lwjglVersion}:natives-macos-arm64"))

    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    implementation "org.lwjgl:lwjgl:unsafe"
    include(implementation "org.lwjgl:lwjgl-lmdb:unsafe")
    include(implementation "org.lwjgl:lwjgl-zstd:unsafe")
    runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:natives-linux"
    include(runtimeOnly "org.lwjgl:lwjgl-lmdb:${lwjglVersion}:natives-windows")
    include(runtimeOnly "org.lwjgl:lwjgl-zstd:${lwjglVersion}:natives-windows")
    include(runtimeOnly "org.lwjgl:lwjgl-lmdb:${lwjglVersion}:natives-linux")
    include(runtimeOnly "org.lwjgl:lwjgl-zstd:${lwjglVersion}:natives-linux")
    include(runtimeOnly "org.lwjgl:lwjgl-lmdb:${lwjglVersion}:natives-macos")
    include(runtimeOnly "org.lwjgl:lwjgl-zstd:${lwjglVersion}:natives-macos")
    include(runtimeOnly "org.lwjgl:lwjgl-lmdb:${lwjglVersion}:natives-macos-arm64")
    include(runtimeOnly "org.lwjgl:lwjgl-zstd:${lwjglVersion}:natives-macos-arm64")
    if (includeOtherArchs) {
        runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:natives-linux-arm64"
        include(runtimeOnly "org.lwjgl:lwjgl-lmdb:${lwjglVersion}:natives-linux-arm64")
        include(runtimeOnly "org.lwjgl:lwjgl-zstd:${lwjglVersion}:natives-linux-arm64")
    }

    // Embedded storage and compression libraries
    include(implementation 'redis.clients:jedis:5.1.0')
    include(implementation('org.rocksdb:rocksdbjni:10.2.1'))
    include(implementation 'org.apache.commons:commons-pool2:2.12.0')
    include(implementation 'org.lz4:lz4-java:1.8.0')
    include(implementation('org.tukaani:xz:1.10'))
    include(implementation('org.xerial:sqlite-jdbc:3.49.1.0'))

    testImplementation('org.junit.jupiter:junit-jupiter:5.12.2')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.12.2')
}


def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
    it.options.deprecation = true
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.register('makeExcludedRocksDB', Zip) {
    archiveExtension.set("jar")
    entryCompression = ZipEntryCompression.STORED
    destinationDirectory.set temporaryDir

    dependsOn configurations.includeInternal

    def files = configurations.includeInternal.incoming.getArtifacts().getArtifactFiles().filter {
        it.name.startsWith('rocksdb')
    }
    
    from {->zipTree(files.first())}
    archiveFileName.set(providers.provider{files.first().name})

    exclude {
        def file = it.name
        if (file.endsWith(".jnilib")) {
            //Keep macOS arm64 native so RocksDB works on Apple Silicon (VK/MoltenVK
            // target); drop x86_64. Without this, world load crashes on M-series Macs
            // with "librocksdbjni-osx-arm64.jnilib was not found inside JAR".
            return !file.contains("osx-arm64")
        }
        if (!file.endsWith(".so")) {
            return false
        }
        return ["osx", "linux32", "musl", "s390x", "riscv64", "ppc64le", "aarch64"].any(file::contains)
    }
}




processIncludeJars {
    if (!includeOtherArchs) {
        dependsOn makeExcludedRocksDB
        jars = jars.filter {!it.name.startsWith('rocksdb')}
        jars.from(makeExcludedRocksDB)
    }
}

test {
    useJUnitPlatform()
    systemProperty 'org.lwjgl.system.SharedLibraryExtractPath',
            layout.buildDirectory.dir('tmp/lwjgl-natives').get().asFile.absolutePath
}
